# The forum bot's container image (discord-bot/Dockerfile) -> ghcr.io/<owner>/<repo>-bot, for amd64 and arm64, tagged
# latest and sha-<commit>, on the pushes that change discord-bot/.  It holds only the bot, which clones the code when it
# runs; its rules (system.md, knowledge.md) come from that clone too, so a change to those needs no new image.
name: image-bot
on:
  push:
    branches: [main]
    paths: ['discord-bot/**', .github/workflows/image-bot.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-bot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-bot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: discord-bot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-bot
          cache-to: type=gha,mode=max,scope=image-bot
